version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: taskflow_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./server
    container_name: taskflow_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/taskmanager
      - JWT_SECRET=supersecret_jwt_key_task_manager_2026_spec
      - NODE_ENV=production
    depends_on:
      - mongodb

  frontend:
    build: ./client
    container_name: taskflow_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
